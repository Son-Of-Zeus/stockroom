spring.application.name=stockroom
server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
server.tomcat.accesslog.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/stockroom?replicaSet=rs0&directConnection=true&serverSelectionTimeoutMS=3000&connectTimeoutMS=2000&timeoutMS=10000}
spring.mvc.log-request-details=false
spring.jackson.deserialization.fail-on-unknown-properties=true
logging.level.org.mongodb.driver=WARN
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
app.owner-key=${OWNER_ACCESS_KEY:}
app.instance-id=${INSTANCE_ID:local}
app.base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.trusted-proxy=${TRUSTED_PROXY_IP:}
app.redis-rate=${REDIS_RATE:127.0.0.1:6379}
app.redis-caches=${REDIS_CACHES:127.0.0.1:6380,127.0.0.1:6381}
app.rate-capacity=${RATE_CAPACITY:60}
app.rate-refill=${RATE_REFILL:2}
spring.jackson.deserialization.accept-float-as-int=false
